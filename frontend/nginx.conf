server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Docker's embedded DNS server — lets nginx re-resolve "backend" per
    # request instead of once at startup. Without this, a static
    # `proxy_pass http://backend:8000` hostname gets resolved exactly once
    # when nginx boots; if the backend container isn't up yet at that exact
    # moment (different start order, still restarting, etc.) nginx fails
    # with "host not found in upstream" and refuses to start at all — it
    # doesn't retry. Using a variable + resolver defers DNS lookup to each
    # request, so nginx starts fine regardless of backend's state and just
    # returns 502 until backend comes up, instead of crashing itself.
    resolver 127.0.0.11 valid=10s;

    # Proxy API calls to the backend container. The frontend app calls a
    # same-origin relative '/api/...' path.
    location /api/ {
        set $backend_upstream http://backend:8000;
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_buffering off;   # needed for /api/metrics/stream (SSE) to flush live
    }

    # WebSocket SSH terminal proxy
    location /ws/ {
        set $backend_upstream http://backend:8000;
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host       $host;
        proxy_read_timeout 3600s;
    }

    # Never cache index.html so frontend updates are immediate
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
        expires -1;
    }

    # React/Vite SPA routing
    location / {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
        try_files $uri $uri/ /index.html;
    }

    # Cache static hashed assets (immutable since Vite fingerprints asset filenames)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}