services:

  # ── Migrate: runs backend/db/migrate.js once, then exits ─────────────────────
  migrate:
    build: ./backend
    command: ["node", "db/migrate.js"]
    depends_on:
      mysql:
        condition: service_healthy
    env_file:
      - .env.local
    networks:
      - netcontrol-net
    restart: "no"

  backend:
    build: ./backend
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
      migrate:
        condition: service_completed_successfully
    environment:
      - PROCESS_ROLE=web
    ports:
      # Exposed directly so you can hit the API on the host without a
      # reverse proxy in front of it (e.g. for testing with curl/Postman,
      # or pointing an agent at http://localhost:8000).
      - "8000:8000"
    env_file:
      - .env.local
    networks:
      - netcontrol-net

  # ── Poller: status polling + cron schedules + compliance checks ─────────────
  # Runs as ONE instance — do not scale this.
  poller:
    build: ./backend
    command: ["node", "poller.js"]
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
      migrate:
        condition: service_completed_successfully
    environment:
      - PROCESS_ROLE=poller
    env_file:
      - .env.local
    networks:
      - netcontrol-net
    restart: unless-stopped

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      # This is the URL you open in the browser: http://localhost:8080
      - "8080:80"
    networks:
      - netcontrol-net

  # ── Redis: cross-process bus for SSE fan-out + metrics sync ─────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    networks:
      - netcontrol-net
    volumes:
      - netcontrol_redis_data_local:/data

  mysql:
    image: mysql:8.4
    restart: unless-stopped
    env_file:
      - .env.local
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    ports:
      # Optional — lets you connect a local MySQL client/GUI to inspect data.
      # Remove this if you don't need host access to the DB.
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    networks:
      - netcontrol-net
    volumes:
      - netcontrol_db_data_local:/var/lib/mysql

volumes:
  netcontrol_db_data_local:
  netcontrol_redis_data_local:

networks:
  netcontrol-net:
    driver: bridge