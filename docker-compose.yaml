services:

  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel run
    restart: unless-stopped
    networks:
      - frontend-net
    volumes:
      -  ./cloudflared:/etc/cloudflared


  traefik:
    image: traefik:latest
    command:
      - "--configFile=/traefik.yaml"
    restart: unless-stopped 
    security_opt:
      - no-new-privileges:true 
    networks:
      - frontend-net
    expose:
      - "80"
    env_file: .env 
    volumes:
      - /etc/localtime:/etc/localtime:ro 
      - /var/run/docker.sock:/var/run/docker.sock:ro 
      - ./data/traefik.yaml:/traefik.yaml:ro 
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.traefik.entrypoints=http"
      - "traefik.http.routers.traefik.rule=Host(`traefik-dashboard.notoriousdev.in`)"
      - "traefik.http.middlewares.traefik-auth.basicauth.users=${TRAEFIK_DASHBOARD_CREDENTIALS}"
      - "traefik.http.routers.traefik.middlewares=traefik-auth"
      - "traefik.http.routers.traefik.service=api@internal"

  frontend:
    build: ./frontend
    depends_on:
      - backend
    expose: 
      - "80"
    labels:
      - traefik.enable=true
      - traefik.http.routers.frontend.rule=Host(`netcontrol.notoriousdev.in`)
      - traefik.http.services.frontend.loadbalancer.server.port=80
    networks:
      - frontend-net
  
  backend:
    build: ./backend
    depends_on:
      - mysql
      - redis
    environment:
      - PROCESS_ROLE=web
    expose:
      - "8000"
    labels:
      - traefik.enable=true
      - traefik.http.routers.backend.rule=Host(`netcontrol-api.notoriousdev.in`)
      - traefik.http.services.backend.loadbalancer.server.port=8000
      - "traefik.docker.network=netcontrol_frontend-net"

    env_file: 
      - .env
    networks:
      - backend-net
      - frontend-net

  # ── Poller: status polling + cron schedules + compliance checks ─────────────
  # Runs as ONE instance (do not scale this) so scheduled actions and device
  # polling never execute more than once per tick. See backend/poller.js for
  # the full rationale. Shares the same image/env as `backend`, different
  # entrypoint, no exposed port — it talks to MySQL and Redis only.
  poller:
    build: ./backend
    command: ["node", "poller.js"]
    depends_on:
      - mysql
      - redis
    environment:
      - PROCESS_ROLE=poller
    env_file:
      - .env
    networks:
      - backend-net
    restart: unless-stopped
    deploy:
      replicas: 1

  # ── Redis: cross-process bus for SSE fan-out + metrics sync ─────────────────
  # Used by the clustered `backend` workers to share live metric snapshots/SSE
  # broadcasts with each other (see backend/services/bus.js). Not used as a
  # cache or queue — just pub/sub, so default config is fine.
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    networks:
      - backend-net
    volumes:
      - netcontrol_redis_data:/data

  mysql:
    image: mysql:8.4
    restart: unless-stopped
    env_file:
      - .env
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    networks:
      - backend-net

    volumes:
      - netcontrol_db_data:/var/lib/mysql 
volumes:
  netcontrol_db_data:
  netcontrol_redis_data:

networks:
  frontend-net:
    driver: bridge
  backend-net:
    driver: bridge